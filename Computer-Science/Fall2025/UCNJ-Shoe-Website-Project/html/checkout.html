 <!DOCTYPE html>
<html>
<head>
    <title>Sneaker World - Shop</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans">
    <style>
        body {
            background-image: url("../assets/bee.webp");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-color: #ffffff;
            backdrop-filter: blur(10pt);
            color: white;
            font-family: 'Open Sans';
            text-align: center;
            height: 100%
        }
        .nav{
            background-color: #333;
            overflow: hidden;
        }
        .nav a {
            float: left;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
        }
        .nav p {
            float: left;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
        }
        .nav a:hover{
            background-color: #ddd;
            color: black;
        }
        input {
            padding: 12px;
            width: 250px;
            margin: 10px;
            border-radius: 5px;
            border: none;
        }
        a.button {
            color: white;
            margin-top: 20px;
            display: inline-block;
            text-decoration: none;
        }
        .container {
        display: grid;
        border-radius: 45px;
        grid-template-columns: auto auto auto auto;
        background-color: #00000045;
        padding: 25px;
        align-items: stretch;
        }

        .container #cartlist {
            grid-template-columns: auto auto auto;
        }

        .imgButton{
            text-align:center;
        }

        .name{
            color: white;
            font-size: 15pt;
        }

        .visButton{
            background-color: white;
            color: black;
            padding: 15px 25px;
            margin: 20px;
            text-decoration: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        .visButton:hover{
            background-color: gray;
            color: white;
        }

        .container div {
        background-color: #00000000;
        border: 0px solid black;
        padding: 1px;
        font-size: 30px;
        text-align: center;
        }

        img {
        display: box;
        width: 250px;
        height:250px;
        border-radius: 12px;
        }

    </style>
</head>
<body>
    <div id='navbar' class="nav">
        <a class="active" href="../index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a id='login' style="float: right;" href="login.html">Log In</a>
        <a id="balance" style="float: right;">Balance - $0</a>
    </div>
    <h1>Checkout</h1>

    <div id='container'class="container"> 
        <div id="cartlist" class="container">
            <p id="empty" style="text-align: center;">empty</p>
        </div>
        <div>
            <div style="text-align: right;"><p id="subtotal">subtotal $0.00</p>
            <p id="tax">tax $0.00</p>
            <p id="total">subtotal $0.00</p></div>
            <button class="visButton" onclick="checkout()">checkout</button>
            <button class="visButton" onclick="clearcart()">clear cart</button>
        </div>
    </div>
    <script src="../scripts/cart.js"></script>
    <script src="../scripts/usernameshowingscript.js"></script>
</body>
</html>
