{% extends "base.html" %}
{% block title %}Log In{% endblock %}

{% block content %}
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <header>Login</header>
            </div>
            {% if request.args.get('error') == 'invalid' %}
                <p style="color: red; text-align: center;">Invalid username or password</p>
            {% endif %}
            <form action="/login" method="POST">
            <div class="input-box">
                <input type="text" name="email_or_username" class="input-field" placeholder="Email or Username" required>
            </div>
            <div class="input-box">
                <input type="password" name="password" class="input-field" placeholder="Password" required>
            </div>
            <div class="input-submission">
                <button class="login-btn" id="login-submission">Sign In</button>   
            </div>
            </form>
            <div class="registration-link">
                <p>Dont have an account?<a href="/registration">Sign Up</a></p>
            </div>
        </div>
    </div>
</body>
</html>
{% endblock %}
