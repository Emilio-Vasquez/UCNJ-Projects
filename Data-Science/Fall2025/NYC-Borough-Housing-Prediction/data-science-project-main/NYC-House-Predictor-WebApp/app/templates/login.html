{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="card m-auto w-25 h-50 shadow p-3 mt-5 mb-5 rounded">
    <div class="card-body">
        <h5 class="card-title"><span class="fw-bold">Login</span></h5>
        <form method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password">
            </div>
            <a class="text-primary d-block mb-2" href="{{ url_for('signup') }}">Don't have an account?</a>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
    </div>
</div>

{% endblock %}
