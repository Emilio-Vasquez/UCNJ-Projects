{% extends "base.html" %}

{% block title %}Feedback{% endblock %}

{% block content %}


<div class="card m-auto w-50 shadow p-4 mt-5 mb-5 rounded">
    <h4 class="fw-bold mb-3">Submit Feedback</h4>

    <form id="feedbackForm">
        <div class="mb-3">
            <label class="form-label">Your Feedback</label>
            <textarea id="content" class="form-control" rows="5" placeholder="Write your feedback here..." required></textarea>
        </div>

        <button type="submit" class="btn btn-primary w-100">Submit</button>
    </form>

    <div id="feedbackMessage" class="mt-3 text-success fw-bold" style="display:none;">
        Feedback submitted!
    </div>
</div>

<script>
document.getElementById("feedbackForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const content = document.getElementById("content").value;

    const response = await fetch("{{ url_for('feedback') }}", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ content: content })
    });

    if (response.ok) {
        document.getElementById("feedbackMessage").style.display = "block";
        document.getElementById("content").value = "";
    }
});
</script>

{% endblock %}
