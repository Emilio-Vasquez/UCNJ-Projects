<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
          rel="stylesheet">

    <title>{% block title %}NYC House Price Predictor{% endblock %}</title>

    <style>
        /* --- GLOBAL THEME --- */
        body {
            background: #eef1f5;      /* clean light gray background */
            font-family: 'Roboto', sans-serif;
        }

        /* Modern card look for all pages */
        .card {
            border: none;
            border-radius: 12px;
        }

        /* Title styling across pages */
        h1, h2, h3, h4, h5 {
            font-weight: 600;
        }

        /* Smooth hover for buttons */
        .btn:hover {
            opacity: 0.9;
            transition: 0.2s ease-in-out;
        }

        /* Navbar theme */
        .navbar-custom {
            background-color: #003366;      /* Deep NYC blue */
        }
        .navbar-custom .navbar-brand,
        .navbar-custom .nav-link {
            color: #ffffff !important;
            font-weight: 500;
        }
        .navbar-custom .btn {
            color: white !important;
        }

        /* Active link highlight */
        .nav-link.active {
            text-decoration: underline;
        }

    </style>
</head>

<body>

    <!-- NAVBAR (will be filled by each page) -->
    {% block navbar %}
<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">

        <a class="navbar-brand fw-bold fs-4" href="{{ url_for('home') }}">
            NYC House Price Predictor
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNavDropdown">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('home') }}">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('charts') }}">Charts</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('feedback_page') }}">Feedback</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('render_history') }}">History</a>
                </li>

                {% if session.get("is_admin") %}
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('admin_feedback') }}">Admin Feedback</a>
                </li>
                {% endif %}

            </ul>

            <a class="btn btn-outline-danger ms-lg-3" href="{{ url_for('logout') }}">
                Logout
            </a>
        </div>

    </div>
</nav>
{% endblock %}

    <!-- MAIN PAGE CONTENT -->
    <main class="content-wrapper">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
</body>
</html>
